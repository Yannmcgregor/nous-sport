name: Build Nous Sport V40 CORRIGE CONNEXION

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Find V40 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V40*CORRIGE*CONNEXION*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then echo "Aucun ZIP V40 trouvé."; exit 1; fi
          echo "V40_ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Extract V40 Android project
        shell: bash
        run: |
          set -e
          rm -rf v40-extracted
          mkdir -p v40-extracted
          unzip -q -o "$V40_ZIP" -d v40-extracted
          ANDROID_DIR="$(find v40-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
      - name: Verify V40
        shell: bash
        run: |
          set -e
          grep -Fq 'const $ = id => document.getElementById(id)' "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq '/auth/v1/otp' "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq '/auth/v1/verify' "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq 'web.loadDataWithBaseURL' "$ANDROID_DIR/app/src/main/java/com/noussport/app/MainActivity.kt"
          grep -Fq 'appassets.androidplatform.net/assets/' "$ANDROID_DIR/app/src/main/java/com/noussport/app/MainActivity.kt"
          grep -Fq 'versionCode 81' "$ANDROID_DIR/app/build.gradle"
          grep -Fq 'android:icon="@mipmap/ic_launcher"' "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          test -f "$ANDROID_DIR/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V40-CORRIGE-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
