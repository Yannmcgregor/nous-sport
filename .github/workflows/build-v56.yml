name: Build Nous Sport V56

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V56 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V56*.zip' -print -quit)"
          test -n "$ZIP"
          echo "V56_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V56 Android project
        shell: bash
        run: |
          set -e
          rm -rf v56-extracted
          mkdir -p v56-extracted
          unzip -q -o "$V56_ZIP" -d v56-extracted
          ANDROID_DIR="$(find v56-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Verify V56
        shell: bash
        run: |
          set -e
          KT="$ANDROID_DIR/app/src/main/java/com/noussport/app/MainActivity.kt"
          GRADLE="$ANDROID_DIR/app/build.gradle"

          grep -Fq 'aggregateGroupByPeriod' "$KT"
          grep -Fq 'AggregateGroupByPeriodRequest' "$KT"
          grep -Fq 'timeRangeSlicer = Period.ofDays(1)' "$KT"
          grep -Fq 'timeRangeFilter = TimeRangeFilter.between(startLocal, endLocal)' "$KT"
          ! grep -Fq 'DataOrigin("com.sec.android.app.shealth")' "$KT"
          grep -Fq 'versionCode 97' "$GRADLE"
          grep -Fq "versionName '0.9.20'" "$GRADLE"

          echo "V56 vérifiée: total de pas du jour calculé avec une agrégation par période locale."

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V56-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
