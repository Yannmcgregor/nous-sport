name: Build Nous Sport V57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V57 ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname 'V57*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : V57.zip introuvable"
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V57
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q "$ZIP_PATH" -d project

          echo "Contenu extrait :"
          find project -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERREUR : gradlew introuvable dans V57"
            exit 1
          fi

          APP_DIR=$(dirname "$GRADLEW")

          echo "Gradle trouvé : $GRADLEW"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V57
          path: |
            project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
