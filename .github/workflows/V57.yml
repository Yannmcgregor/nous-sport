name: Build Nous Sport V57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V57 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 3 -type f -iname 'V57*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP V57 trouvé"
            exit 1
          fi
          echo "ZIP trouvé : $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V57
        shell: bash
        run: |
          set -e
          rm -rf v57-extracted
          mkdir -p v57-extracted
          unzip -q "$ZIP_PATH" -d v57-extracted

          echo "Recherche du projet Android..."
          find v57-extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find v57-extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"
          BUILD="$(find v57-extracted -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1)"
          GRADLEW="$(find v57-extracted -type f -name 'gradlew' | head -n 1)"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          elif [ -n "$BUILD" ]; then
            PROJECT_DIR="$(dirname "$BUILD")"
          elif [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
          else
            echo "ERREUR : aucun projet Gradle Android trouvé dans V57"
            echo "Contenu du ZIP :"
            find v57-extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Projet Gradle : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "gradlew absent : installation de Gradle 8.7"
            cd "$GITHUB_WORKSPACE"
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip -d "$GITHUB_WORKSPACE/gradle-dist"
            echo "GRADLE_CMD=$GITHUB_WORKSPACE/gradle-dist/gradle-8.7/bin/gradle" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "===== CONTENU DE android/app/build.gradle ====="
          if [ -f "android/app/build.gradle" ]; then
            sed -n '1,120p' android/app/build.gradle
          elif [ -f "app/build.gradle" ]; then
            sed -n '1,120p' app/build.gradle
          else
            echo "build.gradle introuvable dans le projet sélectionné"
            find . -maxdepth 4 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print
          fi
          echo "===== FIN build.gradle ====="

          "$GRADLE_CMD" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V57
          path: |
            v57-extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
