name: Build Nous Sport V54

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V54 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V54*.zip' -print -quit)"
          test -n "$ZIP"
          echo "V54_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V54 Android project
        shell: bash
        run: |
          set -e
          rm -rf v54-extracted
          mkdir -p v54-extracted
          unzip -q -o "$V54_ZIP" -d v54-extracted
          ANDROID_DIR="$(find v54-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Verify V54
        shell: bash
        run: |
          set -e
          KT="$ANDROID_DIR/app/src/main/java/com/noussport/app/MainActivity.kt"
          GRADLE="$ANDROID_DIR/app/build.gradle"

          grep -Fq 'NOUS SPORT V54: read the Health Connect total steps' "$KT"
          ! grep -Fq 'DataOrigin("com.sec.android.app.shealth")' "$KT"
          grep -Fq 'metrics = setOf(StepsRecord.COUNT_TOTAL)' "$KT"
          grep -Fq 'versionCode 95' "$GRADLE"
          grep -Fq "versionName '0.9.18'" "$GRADLE"

          echo "V54 vérifiée: lecture du total de pas Santé Connect sans filtre de source."

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V54-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
