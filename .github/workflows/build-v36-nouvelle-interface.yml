name: Build Nous Sport V36 NOUVELLE INTERFACE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V36 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V36*NOUVELLE*INTERFACE*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Aucun ZIP V36 trouvé."
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi
          echo "ZIP trouvé : $ZIP"
          echo "V36_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V36 Android project
        shell: bash
        run: |
          set -e
          rm -rf v36-extracted
          mkdir -p v36-extracted
          unzip -q -o "$V36_ZIP" -d v36-extracted
          ANDROID_DIR="$(find v36-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          if [ -z "$ANDROID_DIR" ]; then
            echo "Projet Android V36 introuvable."
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projet Android : $ANDROID_DIR"

      - name: Verify V36 interface
        shell: bash
        run: |
          set -e
          grep -Fq 'goals-title' "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq 'goal-chip' "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq 'repeat(2,minmax(0,1fr))' "$ANDROID_DIR/app/src/main/assets/src/style.css"
          grep -Fq "versionCode 76" "$ANDROID_DIR/app/build.gradle"
          grep -Fq "versionName '0.8.0'" "$ANDROID_DIR/app/build.gradle"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V36-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
