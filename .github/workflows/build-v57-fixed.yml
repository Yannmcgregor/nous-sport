name: Build Nous Sport V57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare V57 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v57-extracted
          mkdir -p v57-extracted

          ZIP="$(find . -type f -iname '*V57*.zip' -print -quit || true)"
          if [ -n "$ZIP" ]; then
            echo "ZIP V57 trouvé dans le dépôt: $ZIP"
          else
            echo "ZIP V57 absent du dépôt: utilisation de V57 intégré au workflow."
