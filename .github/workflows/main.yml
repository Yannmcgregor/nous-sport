name: Build Nous Sport Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Trouver et extraire le projet Android
        shell: bash
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Aucun fichier ZIP trouvé"
            exit 1
          fi

          rm -rf android
          mkdir -p android
          unzip -q "$ZIP" -d android

          PROJECT_DIR="android/android"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Projet Gradle Android introuvable"
            find android -maxdepth 4 -type f | head -100
            exit 1
          fi

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          echo "GRADLEW=$PROJECT_DIR/gradlew" >> "$GITHUB_ENV"

      - name: Construire APK
        shell: bash
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-sport-debug-apk
          path: android/android/app/build/outputs/apk/debug/*.apk
