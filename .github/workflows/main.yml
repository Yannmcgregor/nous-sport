name: Build Nous Sport V16 NATIF

on:
  workflow_dispatch:

jobs:
  build-v16:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Vérifier et extraire UNIQUEMENT V16
        shell: bash
        run: |
          set -euo pipefail
          ZIP="./nous-sport-v16-natif.zip"
          test -f "$ZIP"
          rm -rf v16-extracted
          mkdir -p v16-extracted
          unzip -q "$ZIP" -d v16-extracted
          ROOT=$(find v16-extracted -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          echo "V16 ROOT=$ROOT"
          test -f "$ROOT/android/app/src/main/java/com/noussport/app/MainActivity.java" || true
          cd "$ROOT"
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          ./gradlew clean assembleDebug --no-daemon

      - name: Publier UNIQUEMENT APK V16
        uses: actions/upload-artifact@v4
        with:
          name: NOUS-SPORT-V16-APK
          path: v16-extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
