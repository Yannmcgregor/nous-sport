name: Build Nous Sport V21

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip V21
        run: |
          unzip -o V21.zip -d .
          test -f project/android/settings.gradle
          test -f project/android/app/build.gradle

      - name: Build APK
        run: |
          cd project/android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V21
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
