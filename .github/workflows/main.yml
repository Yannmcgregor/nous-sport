name: Build Nous Sport Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et extraire le projet Android
        shell: bash
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Aucun fichier ZIP trouve"
            exit 1
          fi

          echo "ZIP trouve : $ZIP"

          rm -rf android
          mkdir -p android
          unzip -q "$ZIP" -d android

          PROJECT_DIR=$(find android -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable dans le ZIP"
            find android -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Projet Android : $PROJECT_DIR"

          echo "Mise a jour Android Gradle Plugin vers 8.9.1"

          while IFS= read -r f; do
            sed -i 's/8\.7\.3/8.9.1/g' "$f"
          done < <(find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \))

          echo "Alignement Java/Kotlin sur JVM 17 (sans option JavaCompile --release)"

          # Corrige les anciennes cibles Java 8/Kotlin 1.8 dans les fichiers Gradle.
          while IFS= read -r f; do
            sed -i \
              -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
              -e 's/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g' \
              -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*["'"'"']1\.8["'"'"']/sourceCompatibility = JavaVersion.VERSION_17/g' \
              -e 's/targetCompatibility[[:space:]]*=[[:space:]]*["'"'"']1\.8["'"'"']/targetCompatibility = JavaVersion.VERSION_17/g' \
              -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*1\.8/sourceCompatibility = JavaVersion.VERSION_17/g' \
              -e 's/targetCompatibility[[:space:]]*=[[:space:]]*1\.8/targetCompatibility = JavaVersion.VERSION_17/g' \
              -e 's/sourceCompatibility[[:space:]]\+JavaVersion\.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/g' \
              -e 's/targetCompatibility[[:space:]]\+JavaVersion\.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/g' \
              -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'"'"']1\.8["'"'"']/jvmTarget = "17"/g' \
              -e 's/jvmTarget[[:space:]]*=[[:space:]]*["'"'"']8["'"'"']/jvmTarget = "17"/g' \
              "$f"
          done < <(find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \))

          # Force aussi compileOptions dans le module app si le projet n'en possède pas.
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ] && ! grep -q 'compileOptions[[:space:]]*{' "$APP_GRADLE"; then
            perl -0pi -e 's/(android\s*\{)/$1\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }/s' "$APP_GRADLE"
          fi

          # Le JDK de build reste Java 17. Les tâches Java/Kotlin sont alignées sur JVM 17.
          if [ -f "$APP_GRADLE" ]; then
            sed -i '/jvmToolchain(17)/d' "$APP_GRADLE"
            cat >> "$APP_GRADLE" <<'KOTLIN_EOF'

          // Dernier verrou d'alignement : Java et Kotlin ciblent tous deux JVM 17.
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          KOTLIN_EOF
          fi

          echo "Verification des cibles JVM detectees :"
          grep -RniE 'VERSION_1_8|VERSION_8|jvmTarget|sourceCompatibility|targetCompatibility|jvmToolchain' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' || true

          rm -f "$PROJECT_DIR/app/src/main/res/xml/health_permissions.xml"

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml introuvable : $MANIFEST"
            exit 1
          fi

          echo "Correction Health Connect"

          for P in \
            android.permission.health.READ_STEPS \
            android.permission.health.READ_DISTANCE \
            android.permission.health.READ_HEART_RATE \
            android.permission.health.READ_ACTIVE_CALORIES_BURNED \
            android.permission.health.READ_TOTAL_CALORIES_BURNED
          do
            grep -q "$P" "$MANIFEST" || sed -i "s#<application#<uses-permission android:name=\"$P\" />\n    <application#" "$MANIFEST"
          done

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

          # Nettoyage des anciennes configurations Java release.
          # Android Gradle Plugin doit gérer lui-même le bootclasspath Android.
          while IFS= read -r f; do
            sed -i \
              -e '/options\.release\.set/d' \
              -e '/options\.release[[:space:]]*=/d' \
              -e '/compilerOptions.*release/d' \
              "$f"
          done < <(find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \))

          echo "GRADLEW=$PROJECT_DIR/gradlew" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"



          echo "INIT_SCRIPT=$INIT_SCRIPT" >> "$GITHUB_ENV"

      - name: Construire APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "Construction Android avec Java 17 / Kotlin 17"
          ./gradlew assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-sport-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
