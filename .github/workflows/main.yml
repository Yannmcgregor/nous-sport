name: Build Nous Sport V29.5 FIX URL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip V29.5 FIX URL
        shell: bash
        run: |
          set -e
          unzip -o 'Nous-Sport-V29-5-corrige-analyse-repas-FIX-URL.zip' -d .
          test -d android
          test -f android/app/build.gradle

      - name: Verify meal bridge
        shell: bash
        run: |
          set -e
          grep -Fq "supabase.functions.invoke('analyze-meal'" android/app/src/main/assets/src/main.js
          ! grep -Fq 'fetch(`${url}/functions/v1/analyze-meal`' android/app/src/main/assets/src/main.js

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOUS-SPORT-V29-5-FIX-URL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
