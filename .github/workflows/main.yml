name: Build Nous Sport Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Trouver et extraire le projet Android
        shell: bash
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Aucun fichier ZIP trouve"
            exit 1
          fi

          rm -rf android
          mkdir -p android
          unzip -q "$ZIP" -d android

          GRADLEW=$(find android -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew introuvable dans le ZIP"
            find android -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouve dans: $ANDROID_DIR"

      - name: Donner les permissions Gradle
        shell: bash
        run: |
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Construire APK
        shell: bash
        run: |
          cd "$ANDROID_DIR"
          ./gradlew assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-sport-debug
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
