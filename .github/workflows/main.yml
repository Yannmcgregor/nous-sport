name: Build Nous Sport V32 FIX IMAGE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract V32 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -iname '*V32*FIX*IMAGE*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: V32 ZIP not found"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi
          unzip -o "$ZIP" -d .
          test -f android/app/build.gradle

      - name: Verify image payload fix
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "functions.invoke('analyze-meal'" android/app/src/main/assets/src/main.js
          grep -Fq 'imageDataUrl:mealImageDataUrl' android/app/src/main/assets/src/main.js
          grep -Fq 'imageDataUrl:mealImageDataUrl' src/main.js
          if grep -Fq 'base64:mealImageDataUrl' android/app/src/main/assets/src/main.js; then
            echo 'ERROR: old base64-only payload still present'
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOUS-SPORT-V32-FIX-IMAGE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
