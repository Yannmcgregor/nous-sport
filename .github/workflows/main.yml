name: Build Nous Sport Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Trouver et extraire le projet Android
        shell: bash
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Aucun fichier ZIP trouve"
            exit 1
          fi

          rm -rf android
          mkdir -p android
          unzip -q "$ZIP" -d android

          echo "Contenu extrait :"
          find android -maxdepth 4 -type f | head -n 100

      - name: Trouver le dossier Gradle Android
        shell: bash
        run: |
          GRADLEW=$(find android -type f -name gradlew | head -n 1 || true)

          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"
            echo "gradlew trouve : $GRADLEW"
          else
            PROJECT_DIR=$(find android -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "Projet Gradle Android introuvable"
              find android -maxdepth 5 -type f
              exit 1
            fi

            echo "Projet Gradle trouve : $PROJECT_DIR"
            cd "$PROJECT_DIR"
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
            echo "GRADLEW=$PROJECT_DIR/gradlew" >> "$GITHUB_ENV"
          fi

      - name: Construire APK
        shell: bash
        run: |
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-sport-debug
          path: "**/build/outputs/apk/debug/*.apk"
