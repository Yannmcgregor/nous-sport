name: Build Nous Sport Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Trouver et extraire le ZIP corrigé
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'nous-sport-v13-JVM17-corrige.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ZIP corrigé introuvable."
            exit 1
          fi

          echo "ZIP utilisé : $ZIP"
          rm -rf android_project
          mkdir -p android_project
          unzip -q "$ZIP" -d android_project

      - name: Trouver le projet Android
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find android_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable."
            find android_project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé : $PROJECT_DIR"

      - name: Préparer le wrapper Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "Wrapper absent : création du wrapper Gradle 8.11.1"
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x gradlew

      - name: Construire APK Debug
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Construction avec Java 17 / Gradle 8.11.1"
          ./gradlew assembleDebug --no-daemon

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-sport-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
