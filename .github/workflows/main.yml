name: Build Nous Sport V19 HEALTH CONNECT CORRIGE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract exact V19 project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q nous-sport-v19-healthconnect-corrige.zip -d v19
          ROOT=$(find v19 -type f -name settings.gradle -print -quit | xargs -r dirname)
          test -n "$ROOT"
          cd "$ROOT"
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: NOUS-SPORT-V19-HEALTHCONNECT-CORRIGE-APK
          path: v19/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
