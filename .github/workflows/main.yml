name: Build Nous Sport Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Trouver et extraire le projet Android
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Aucun fichier ZIP trouve"
            exit 1
          fi

          rm -rf android
          mkdir -p android
          unzip -q "$ZIP" -d android

      - name: Trouver Gradle
        run: |
          GRADLEW=$(find android -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew introuvable dans le projet Android"
            find android -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

      - name: Construire APK
        run: |
          cd "$ANDROID_DIR"
          ./gradlew assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-sport-debug
          path: android/**/build/outputs/apk/debug/*.apk
