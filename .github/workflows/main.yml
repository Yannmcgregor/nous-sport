name: Build Nous Sport Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Trouver et extraire le projet Android
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          unzip -q "$ZIP" -d project
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          echo "ANDROID_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Donner les permissions Gradle
        run: chmod +x "$ANDROID_DIR/gradlew"

      - name: Construire APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.ANDROID_DIR }}

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-sport-debug
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
