name: Build V67

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare V67
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing V67"
          test -f android/app/src/main/assets/index.html
          test -f android/app/src/main/assets/src/main.js

      - name: Verify V67 calorie logic
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const adjustedTarget=baseTarget+burned;' android/app/src/main/assets/index.html
          grep -Fq 'const adjustedTarget=baseTarget+burned;' android/app/src/main/assets/src/main.js
          echo 'V67 calorie logic OK: base + burned - eaten'

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check android/app/src/main/assets/src/main.js
          node --check android/app/src/main/assets/index.html 2>/dev/null || true

      - name: Build V67 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew 2>/dev/null || true
          cd android
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Copy APK as V67.apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" V67.apk

      - name: Upload V67 APK
        uses: actions/upload-artifact@v4
        with:
          name: V67-apk
          path: V67.apk
