name: Build Nous Sport V57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare V57 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v57-extracted
          mkdir -p v57-extracted

          ZIP="$(find . -type f -iname '*V57*.zip' -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERREUR: aucun ZIP V57 trouvé dans le dépôt."
            echo "ZIPs disponibles:"
            find . -type f -iname '*.zip' -not -path './.git/*' -print || true
            exit 1
          fi

          echo "ZIP V57 trouvé: $ZIP"
          unzip -q "$ZIP" -d v57-extracted

          GRADLEW="$(find v57-extracted -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERREUR: gradlew introuvable dans le ZIP V57."
            find v57-extracted -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "Projet Android trouvé: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK V57
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_DIR" -type f -name '*.apk' -print

      - name: Upload APK V57
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V57
          path: |
            v57-extracted/**/build/outputs/apk/**/*.apk
            v57-extracted/**/build/outputs/apk/*.apk
          if-no-files-found: error
