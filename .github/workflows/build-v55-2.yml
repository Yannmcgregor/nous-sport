name: Build Nous Sport V55

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V55 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V55*.zip' -print -quit)"
          test -n "$ZIP"
          echo "V55_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V55 Android project
        shell: bash
        run: |
          set -e
          rm -rf v55-extracted
          mkdir -p v55-extracted
          unzip -q -o "$V55_ZIP" -d v55-extracted
          ANDROID_DIR="$(find v55-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Verify V55
        shell: bash
        run: |
          set -e
          KT="$ANDROID_DIR/app/src/main/java/com/noussport/app/MainActivity.kt"
          GRADLE="$ANDROID_DIR/app/build.gradle"

          ! grep -Fq 'dataOriginFilter' "$KT"
          ! grep -Fq 'DataOrigin("com.sec.android.app.shealth")' "$KT"
          grep -Fq 'metrics = setOf(StepsRecord.COUNT_TOTAL)' "$KT"
          grep -Fq 'versionCode 96' "$GRADLE"
          grep -Fq "versionName '0.9.19'" "$GRADLE"

          echo "V55 vérifiée: lecture du total de pas Santé Connect sans filtre Samsung Health."

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V55-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
