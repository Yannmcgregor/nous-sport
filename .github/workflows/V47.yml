name: V47

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V47 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'V47.zip' -print -quit)"
          if [ -z "$ZIP" ]; then echo "V47.zip introuvable."; exit 1; fi
          echo "V47_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V47
        shell: bash
        run: |
          set -e
          rm -rf v47-extracted
          mkdir -p v47-extracted
          unzip -q -o "$V47_ZIP" -d v47-extracted
          ANDROID_DIR="$(find v47-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          if [ -z "$ANDROID_DIR" ]; then echo "Projet Android V47 introuvable."; exit 1; fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Verify V47
        shell: bash
        run: |
          set -e
          INDEX="$ANDROID_DIR/app/src/main/assets/index.html"
          GRADLE="$ANDROID_DIR/app/build.gradle"
          grep -Fq 'let workoutState=null, workoutTimerId=null, workoutPollId=null, homeHealthPollId=null, lastWorkoutData=null' "$INDEX"
          grep -Fq 'versionCode 88' "$GRADLE"
          grep -Fq "versionName '0.9.11'" "$GRADLE"
          echo "V47 OK"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V47
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
