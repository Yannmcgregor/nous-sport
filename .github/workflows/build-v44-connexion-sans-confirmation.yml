name: Build Nous Sport V44 CONNEXION SANS CONFIRMATION

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Find V44 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V44*CONFIRMATION*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then ZIP="$(find . -maxdepth 2 -type f -iname '*V44*.zip' -print -quit)"; fi
          test -n "$ZIP"
          echo "V44_ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Extract V44 Android project
        shell: bash
        run: |
          set -e
          rm -rf v44-extracted
          mkdir -p v44-extracted
          unzip -q -o "$V44_ZIP" -d v44-extracted
          ANDROID_DIR="$(find v44-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.11.1; fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V44-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
