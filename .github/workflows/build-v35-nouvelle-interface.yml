name: Build Nous Sport V35 NOUVELLE INTERFACE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V35 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V35*NOUVELLE*INTERFACE*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Aucun ZIP V35 trouvé."
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi
          echo "ZIP trouvé : $ZIP"
          echo "V35_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V35 Android project
        shell: bash
        run: |
          set -e
          rm -rf v35-extracted
          mkdir -p v35-extracted
          unzip -q -o "$V35_ZIP" -d v35-extracted
          ANDROID_DIR="$(find v35-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          if [ -z "$ANDROID_DIR" ]; then
            echo "Projet Android V35 introuvable."
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projet Android : $ANDROID_DIR"

      - name: Verify V35 interface
        shell: bash
        run: |
          set -e
          test -f "$ANDROID_DIR/app/src/main/assets/src/style.css"
          grep -Fq 'radial-gradient' "$ANDROID_DIR/app/src/main/assets/src/style.css"
          grep -Fq 'versionCode 75' "$ANDROID_DIR/app/build.gradle"
          grep -Fq "versionName '0.7.0'" "$ANDROID_DIR/app/build.gradle"
          grep -Fq 'Santé Connect Android' "$ANDROID_DIR/app/src/main/assets/index.html"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V35-NOUVELLE-INTERFACE-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
