name: Build V69

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare V69
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing V69"
          archive="$(find . -maxdepth 4 -type f -name 'V69.zip' -print -quit || true)"
          if [ -n "$archive" ]; then
            rm -rf .v68_extract
            mkdir -p .v68_extract
            unzip -q "$archive" -d .v68_extract
            if [ -d .v68_extract/android ]; then
              rm -rf android
              cp -a .v68_extract/android ./android
            fi
          fi
          test -f android/app/src/main/assets/index.html
          test -f android/app/src/main/assets/src/main.js

      - name: Verify V69 calorie logic
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const adjustedTarget=baseTarget+burned;' android/app/src/main/assets/index.html
          grep -Fq 'const adjustedTarget=baseTarget+burned;' android/app/src/main/assets/src/main.js
          grep -Fq 'const warning=remaining<500;' android/app/src/main/assets/index.html
          grep -Fq 'const warning=remaining<500;' android/app/src/main/assets/src/main.js
          echo 'V69 calorie logic OK: base + burned - eaten; warning below 500 remaining'

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check android/app/src/main/assets/src/main.js

      - name: Build V69 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew 2>/dev/null || true
          cd android
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Copy APK as V69.apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" V69.apk

      - name: Upload V69 APK
        uses: actions/upload-artifact@v4
        with:
          name: V69-apk
          path: V69.apk
