name: Build Nous Sport V62

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare V62
        shell: bash
        run: |
          set -euo pipefail
          test -f V62.zip
          rm -rf v62-extracted
          mkdir -p v62-extracted
          unzip -q -o V62.zip -d v62-extracted
          test -f v62-extracted/android/app/build.gradle
          test -f v62-extracted/android/app/src/main/assets/index.html
          test -f v62-extracted/android/app/src/main/assets/src/main.js
          echo "ANDROID_DIR=$GITHUB_WORKSPACE/v62-extracted/android" >> "$GITHUB_ENV"
          echo "V62 ZIP OK"
      - name: Verify V62 calorie and meal logic
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const adjustedTarget=baseTarget+burned' "$ANDROID_DIR/app/src/main/assets/src/main.js"
          grep -Fq 'const deficit=Math.round(maintenance+burned-eaten)' "$ANDROID_DIR/app/src/main/assets/src/main.js"
          grep -Fq 'const warning=deficit<500' "$ANDROID_DIR/app/src/main/assets/src/main.js"
          grep -Fq "$('confirmMeal').onclick=async()=>" "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq "supabase.from('meals').insert(payload)" "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq "$('mealStatus').textContent=`Repas ajouté" "$ANDROID_DIR/app/src/main/assets/index.html"
          grep -Fq 'versionCode 101' "$ANDROID_DIR/app/build.gradle"
          echo "V62 logic verified."
      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path("v62-extracted/android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>",html,flags=re.S|re.I)
          if not scripts: raise SystemExit("ERROR: no inline JavaScript")
          Path("/tmp/noussport-inline.js").write_text(scripts[0],encoding="utf-8")
          subprocess.run(["node","--check","/tmp/noussport-inline.js"],check=True)
          subprocess.run(["node","--check","v62-extracted/android/app/src/main/assets/src/main.js"],check=True)
          print("JavaScript V62: OK")
          PY
      - name: Build V62 APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace
      - name: Copy APK as V62.apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/V62.apk"
          test -s "$GITHUB_WORKSPACE/V62.apk"
      - name: Upload V62 APK
        uses: actions/upload-artifact@v4
        with:
          name: V62
          path: V62.apk
          if-no-files-found: error
