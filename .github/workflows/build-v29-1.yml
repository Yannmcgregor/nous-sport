name: Build Nous Sport V29.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unzip V29.2
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name 'Nous-Sport-V29-2-corrige-analyse-repas*.zip' -print -quit)
          test -n "$ZIP"
          unzip -o "$ZIP" -d .
          test -d android
          test -f android/app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd android
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOUS-SPORT-V29-2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
