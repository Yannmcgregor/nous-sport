name: Build Nous Sport V59

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V59 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -type f -name 'V59.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERREUR: V59.zip introuvable dans le dépôt."
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "V59 ZIP trouvé: $ZIP"

      - name: Extract V59 Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v59-extracted
          mkdir -p v59-extracted
          unzip -q "$ZIP" -d v59-extracted
          test -f v59-extracted/android/app/build.gradle
          test -f v59-extracted/android/app/src/main/assets/index.html

      - name: Verify V59 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          html = Path("v59-extracted/android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:[^>]*)>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("ERREUR: aucun bloc JavaScript dans index.html")

          Path("/tmp/noussport-inline.js").write_text(scripts[0], encoding="utf-8")
          subprocess.run(["node", "--check", "/tmp/noussport-inline.js"], check=True)
          subprocess.run([
              "node", "--check",
              "v59-extracted/android/app/src/main/assets/src/main.js"
          ], check=True)

          print("JavaScript V59: OK")
          PY

      - name: Build V59 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p v59-extracted/android --no-daemon assembleDebug
          cp v59-extracted/android/app/build/outputs/apk/debug/app-debug.apk V59.apk
          test -s V59.apk
          echo "APK V59 créé avec succès."

      - name: Upload V59 APK
        uses: actions/upload-artifact@v4
        with:
          name: V59
          path: V59.apk
          if-no-files-found: error
