name: Build Nous Sport V34 PAUSE FEU CALORIES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract V34 Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*V34*.zip' -print -quit || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun ZIP V34 trouvé."
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "ZIP V34 trouvé : $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/v34-project"
          mkdir -p "$GITHUB_WORKSPACE/v34-project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/v34-project"

          ANDROID_DIR="$(find "$GITHUB_WORKSPACE/v34-project" -type f -name 'settings.gradle' -print -quit || true)"

          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR="$(find "$GITHUB_WORKSPACE/v34-project" -type f -name 'settings.gradle.kts' -print -quit || true)"
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERREUR : settings.gradle/settings.gradle.kts introuvable."
            find "$GITHUB_WORKSPACE/v34-project" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$ANDROID_DIR")"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERREUR : build.gradle/build.gradle.kts introuvable dans $PROJECT_DIR"
            exit 1
          fi

          echo "Projet Android trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Contenu du projet Android ==="
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort | head -200

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK générés ==="
          find "$PROJECT_DIR" -type f -name '*.apk' -print

          APK="$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit || true)"

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Nous-Sport-V34-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V34-APK
          path: apk-output/Nous-Sport-V34-debug.apk
          if-no-files-found: error
