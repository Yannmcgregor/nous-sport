name: Build Nous Sport V34 PAUSE FEU CALORIES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract Android V34 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v34-project
          mkdir -p v34-project

          echo "=== Recherche des ZIP V34 ==="
          mapfile -t V34_ZIPS < <(find . -type f -iname "*V34*.zip" -print)

          if [ "${#V34_ZIPS[@]}" -eq 0 ]; then
            echo "ERREUR : aucun ZIP V34 trouvé."
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP V34 trouvés :"
          printf '%s\n' "${V34_ZIPS[@]}"

          FOUND=""

          for ZIP in "${V34_ZIPS[@]}"; do
            echo ""
            echo "=== Test du ZIP : $ZIP ==="

            rm -rf v34-test
            mkdir -p v34-test
            unzip -q "$ZIP" -d v34-test

            GRADLEW="$(find v34-test -type f -name "gradlew" -print -quit || true)"

            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW")"
              rm -rf v34-project
              mkdir -p v34-project
              cp -a "$PROJECT_DIR"/. v34-project/
              FOUND="yes"
              echo "Projet Android trouvé directement : $PROJECT_DIR"
              break
            fi

            echo "Pas de gradlew directement dans ce ZIP."

            while IFS= read -r NESTED_ZIP; do
              echo "Test du ZIP interne : $NESTED_ZIP"

              rm -rf nested-test
              mkdir -p nested-test
              unzip -q "$NESTED_ZIP" -d nested-test || continue

              GRADLEW="$(find nested-test -type f -name "gradlew" -print -quit || true)"

              if [ -n "$GRADLEW" ]; then
                PROJECT_DIR="$(dirname "$GRADLEW")"
                rm -rf v34-project
                mkdir -p v34-project
                cp -a "$PROJECT_DIR"/. v34-project/
                FOUND="yes"
                echo "Projet Android trouvé dans un ZIP interne : $NESTED_ZIP"
                break 2
              fi
            done < <(find v34-test -type f -iname "*.zip" -print)
          done

          if [ -z "$FOUND" ]; then
            echo ""
            echo "ERREUR : aucun projet Android V34 contenant gradlew n'a été trouvé."
            echo ""
            echo "Contenu du V34 trouvé :"
            find v34-test -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          chmod +x v34-project/gradlew

          echo ""
          echo "=== Projet Android sélectionné ==="
          find v34-project -maxdepth 2 -type f | head -100

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/v34-project"

          echo "=== BUILD APK V34 ==="
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK générés ==="
          find "$GITHUB_WORKSPACE/v34-project" -type f -name "*.apk" -print

          APK="$(find "$GITHUB_WORKSPACE/v34-project" -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Nous-Sport-V34-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V34-APK
          path: apk-output/Nous-Sport-V34-debug.apk
          if-no-files-found: error
