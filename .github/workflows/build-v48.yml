name: Build Nous Sport V48

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V48 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V48*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Aucun ZIP V48 trouvé."
            exit 1
          fi
          echo "V48 ZIP : $ZIP"
          echo "V48_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V48 Android project
        shell: bash
        run: |
          set -e
          rm -rf v48-extracted
          mkdir -p v48-extracted
          unzip -q -o "$V48_ZIP" -d v48-extracted
          ANDROID_DIR="$(find v48-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          if [ -z "$ANDROID_DIR" ]; then
            echo "Projet Android V48 introuvable."
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projet Android : $ANDROID_DIR"

      - name: Verify V48
        shell: bash
        run: |
          set -e
          INDEX="$ANDROID_DIR/app/src/main/assets/index.html"
          GRADLE="$ANDROID_DIR/app/build.gradle"
          grep -Fq 'homeHealthPollId=null' "$INDEX"
          grep -Fq 'versionCode 89' "$GRADLE"
          grep -Fq "versionName '0.9.12'" "$GRADLE"
          echo "V48 vérifiée."

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V48-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
