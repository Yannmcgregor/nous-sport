name: Build Nous Sport V57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V57 ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*V57*.zip' -print -quit)"
          test -n "$ZIP"
          echo "V57_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V57 Android project
        shell: bash
        run: |
          set -e
          rm -rf v57-extracted
          mkdir -p v57-extracted
          unzip -q -o "$V57_ZIP" -d v57-extracted
          ANDROID_DIR="$(find v57-extracted -type f -path '*/android/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Verify V57 diagnostic
        shell: bash
        run: |
          set -e
          KT="$ANDROID_DIR/app/src/main/java/com/noussport/app/MainActivity.kt"
          GRADLE="$ANDROID_DIR/app/build.gradle"
          HTML="$ANDROID_DIR/app/src/main/assets/index.html"

          grep -Fq 'V57 diagnostic pas' "$KT"
          grep -Fq 'DataOrigin("com.sec.android.app.shealth")' "$KT"
          grep -Fq 'ReadRecordsRequest' "$KT"
          grep -Fq 'aggregateGroupByPeriod' "$KT"
          grep -Fq 'health_diagnostic' "$KT"
          grep -Fq 'versionCode 98' "$GRADLE"
          grep -Fq "versionName '0.9.21'" "$GRADLE"
          grep -Fq 'health_diagnostic' "$HTML"

          echo "V57 vérifiée: diagnostic agrégé/période/Samsung/brut activé."

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Sport-V57-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
